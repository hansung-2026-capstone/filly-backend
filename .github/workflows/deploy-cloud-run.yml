name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Write application properties
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.properties <<'APPLICATION_PROPERTIES_EOF'
          ${{ secrets.APPLICATION_PROPERTIES }}
          APPLICATION_PROPERTIES_EOF

      - name: Build jar
        run: ./gradlew clean bootJar -x test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push image
        run: |
          docker build -t gcr.io/filly-492515/filly-backend:${{ github.sha }} .
          docker push gcr.io/filly-492515/filly-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy filly-backend \
            --image gcr.io/filly-492515/filly-backend:${{ github.sha }} \
            --project filly-492515 \
            --region asia-northeast3 \
            --platform managed \
            --update-env-vars APP_GCS_PUBLIC_AVATAR_BUCKET=filly-public-media-bucket
